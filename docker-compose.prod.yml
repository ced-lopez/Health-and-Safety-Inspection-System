services:
  db:
    image: mysql:8.4
    container_name: health-safety-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-health_safety_inspection}
      MYSQL_USER: ${DB_USERNAME:-health_safety}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set - create .env from .env.example or set in backend/.env and export it}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD must be set - create .env from .env.example or set in backend/.env and export it}}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 5
      start_period: 20s
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-safety-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # override to ensure prod domain even if .env.production is not reloaded
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://hsis.barangay178caloocan.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://hsis.barangay178caloocan.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://hsis.barangay178caloocan.com}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-hsis.barangay178caloocan.com}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-health_safety_inspection}
      DB_USERNAME: ${DB_USERNAME:-health_safety}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set - create .env from .env.example or set in backend/.env and export it}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: health-safety-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro

  # optional: certbot for TLS (run once: docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/html -d hsis.barangay178caloocan.com)
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/html
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

networks:
  app:
  web:

volumes:
  mysql_data:
  backend_vendor:
  backend_storage:
  certbot_certs:
  certbot_www:
